name: Update Instagram stats

on:
  schedule:
    - cron: "17 11 * * *"   # every day around 5:17 am Austin time (11:17 UTC)
  workflow_dispatch:        # adds a "Run workflow" button for running it by hand

permissions:
  contents: write           # lets the job save the new stats.json back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests and the PDF maker
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Pull stats from Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_ID: ${{ secrets.IG_ID }}
        run: python pull_instagram_stats.py

      - name: Make the media kit PDF
        continue-on-error: true   # if this ever fails, the stats still get saved
        run: python make_media_kit.py

      - name: Save stats.json, cover images and media kit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A stats.json thumbs history
          [ -f media-kit.pdf ] && git add media-kit.pdf
          git diff --cached --quiet || git commit -m "Update Instagram stats"
          git push
